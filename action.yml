name: GroundClaim
description: Check an AI agent's completion claims (in a pull request description or a file) against git, CI and deployments.
author: Since AI ry
branding:
  icon: check-square
  color: green

inputs:
  message:
    description: The claims to check, as text. Default — the pull request description, if the event has one.
    required: false
    default: ""
  message-file:
    description: A file with the claims to check (instead of `message` or the pull request description).
    required: false
    default: ""
  base:
    description: Revision the work started from. Default — the pull request's base commit.
    required: false
    default: ""
  trace:
    description: Path of an agent run trace (GroundClaim JSONL, Claude Code transcript, OpenTelemetry or OpenInference spans).
    required: false
    default: ""
  reports:
    description: Test report files (JUnit XML or CTRF JSON), one per line.
    required: false
    default: ""
  trusted-reports:
    description: "true if the reports were produced by this workflow rather than by the agent."
    required: false
    default: "false"
  require:
    description: Minimum verdict for every checkable claim — none, supported or confirmed. Contradicted claims always fail.
    required: false
    default: "none"
  strict:
    description: "true to also fail on claims that cannot be checked."
    required: false
    default: "false"
  wait-for-checks:
    description: Seconds to wait for the commit's other CI checks to finish before checking.
    required: false
    default: "0"
  ignore-checks:
    description: CI check names to leave out, one per line (add the name of the job running this action).
    required: false
    default: ""
  github-token:
    description: Token for read-only GitHub API calls.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python version to install GroundClaim with.
    required: false
    default: "3.12"

outputs:
  report:
    description: Path of the JSON report.
    value: ${{ steps.check.outputs.report }}
  contradicted:
    description: Number of contradicted claims.
    value: ${{ steps.check.outputs.contradicted }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install GroundClaim
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Check claims
      id: check
      shell: bash
      # Everything that comes from the event or from inputs is passed through environment variables and read
      # by Python — never pasted into the script — so a pull request description cannot inject commands.
      env:
        GC_MESSAGE: ${{ inputs.message }}
        GC_MESSAGE_FILE: ${{ inputs.message-file }}
        GC_BASE: ${{ inputs.base }}
        GC_TRACE: ${{ inputs.trace }}
        GC_REPORTS: ${{ inputs.reports }}
        GC_TRUSTED: ${{ inputs.trusted-reports }}
        GC_REQUIRE: ${{ inputs.require }}
        GC_STRICT: ${{ inputs.strict }}
        GC_WAIT: ${{ inputs.wait-for-checks }}
        GC_IGNORE: ${{ inputs.ignore-checks }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/scripts/action_check.py"
